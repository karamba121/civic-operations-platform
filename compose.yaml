name: civic-operations-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: civic-operations-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civic_operations}
      POSTGRES_USER: ${POSTGRES_USER:-civic_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_ops_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - civic_operations_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: civic-operations-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-civic_ops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-civic_ops_dev}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - civic_operations_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: civic-operations-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - civic_operations_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  civic_operations_postgres_data:
  civic_operations_rabbitmq_data:
  civic_operations_redis_data:
