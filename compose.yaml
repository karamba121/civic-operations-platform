name: civic-operations-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: civic-operations-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civic_operations}
      POSTGRES_USER: ${POSTGRES_USER:-civic_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_ops_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - civic_operations_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: civic-operations-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-civic_ops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-civic_ops_dev}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - civic_operations_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: civic-operations-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - civic_operations_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    container_name: civic-operations-keycloak
    command: ["start-dev", "--http-relative-path=/auth", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-civic_ops_dev}
      KC_HOSTNAME: http://localhost:${FRONTEND_PORT:-4200}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${AUTH_PORT:-8081}:8080"
    volumes:
      - ./identity/keycloak/civicops-realm.json:/opt/keycloak/data/import/civicops-realm.json:ro
      - civic_operations_keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: civic-operations-api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-civic_operations};Username=${POSTGRES_USER:-civic_ops};Password=${POSTGRES_PASSWORD:-civic_ops_dev}
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=500,asyncTimeout=250,syncTimeout=250
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER:-civic_ops}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-civic_ops_dev}
      Database__ApplyMigrations: "true"
      OutboxMetrics__Enabled: "true"
      OutboxMetrics__CollectionInterval: "00:00:15"
      OutboxRetention__Enabled: "true"
      OutboxRetention__RetentionPeriod: "30.00:00:00"
      OutboxRetention__ExecutionInterval: "01:00:00"
      OutboxRetention__BatchDelay: "00:00:00.100"
      OutboxRetention__BatchSize: "500"
      OutboxRetention__MaxBatchesPerCycle: "20"
      OutboxPublisher__Enabled: "true"
      NotificationsConsumer__Enabled: "true"
      Authentication__Enabled: "true"
      Authentication__Authority: http://localhost:${FRONTEND_PORT:-4200}/auth/realms/civicops
      Authentication__MetadataAddress: http://keycloak:8080/auth/realms/civicops/.well-known/openid-configuration
      Authentication__Issuer: http://localhost:${FRONTEND_PORT:-4200}/auth/realms/civicops
      Authentication__Audience: civicops-api
      Authentication__RequireHttpsMetadata: "false"
      IdentityAccess__BootstrapEnabled: "false"
      KeycloakAdministration__Enabled: "true"
      KeycloakAdministration__BaseUrl: http://keycloak:8080/auth
      KeycloakAdministration__Realm: civicops
      KeycloakAdministration__AdminRealm: master
      KeycloakAdministration__AdminUsername: ${KEYCLOAK_ADMIN:-admin}
      KeycloakAdministration__AdminPassword: ${KEYCLOAK_ADMIN_PASSWORD:-civic_ops_dev}
      AttachmentStorage__RootPath: /data/attachments
      OpenTelemetry__Otlp__Enabled: ${OTEL_ENABLED:-false}
      OpenTelemetry__Otlp__Endpoint: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - civic_operations_attachments:/data/attachments
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: civic-operations-frontend
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: civic-operations-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    profiles: ["observability"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_PROMETHEUS_PORT:-8889}:8889"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: civic-operations-blackbox-exporter
    command: ["--config.file=/etc/blackbox_exporter/config.yaml"]
    profiles: ["observability"]
    volumes:
      - ./observability/blackbox.yaml:/etc/blackbox_exporter/config.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: civic-operations-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    profiles: ["observability"]
    depends_on:
      - otel-collector
      - blackbox-exporter
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - civic_operations_prometheus_data:/prometheus
    restart: unless-stopped

volumes:
  civic_operations_postgres_data:
  civic_operations_rabbitmq_data:
  civic_operations_redis_data:
  civic_operations_keycloak_data:
  civic_operations_attachments:
  civic_operations_prometheus_data:
