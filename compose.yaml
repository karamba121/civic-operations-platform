name: civic-operations-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: civic-operations-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civic_operations}
      POSTGRES_USER: ${POSTGRES_USER:-civic_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_ops_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - civic_operations_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  civic_operations_postgres_data:
