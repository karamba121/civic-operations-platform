name: civic-operations-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: civic-operations-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civic_operations}
      POSTGRES_USER: ${POSTGRES_USER:-civic_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_ops_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - civic_operations_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: civic-operations-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-civic_ops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-civic_ops_dev}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - civic_operations_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: civic-operations-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - civic_operations_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: civic-operations-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    profiles: ["observability"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_PROMETHEUS_PORT:-8889}:8889"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: civic-operations-blackbox-exporter
    command: ["--config.file=/etc/blackbox_exporter/config.yaml"]
    profiles: ["observability"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/blackbox.yaml:/etc/blackbox_exporter/config.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: civic-operations-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    profiles: ["observability"]
    depends_on:
      - otel-collector
      - blackbox-exporter
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - civic_operations_prometheus_data:/prometheus
    restart: unless-stopped

volumes:
  civic_operations_postgres_data:
  civic_operations_rabbitmq_data:
  civic_operations_redis_data:
  civic_operations_prometheus_data:
