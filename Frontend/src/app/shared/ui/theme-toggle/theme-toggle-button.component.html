<button
  type="button"
  (click)="toggleTheme()"
  class="relative flex size-11 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white"
  [attr.aria-label]="
    (isDarkMode$ | async) ? 'Ativar tema claro' : 'Ativar tema escuro'
  "
>
  @if (isDarkMode$ | async) {
    <svg
      aria-hidden="true"
      class="size-5"
      viewBox="0 0 20 20"
      fill="none"
    >
      <path
        d="M10 2v1.5M10 16.5V18M18 10h-1.5M3.5 10H2m13.66-5.66L14.6 5.4M5.4 14.6l-1.06 1.06m11.32 0L14.6 14.6M5.4 5.4 4.34 4.34M14 10a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>
  } @else {
    <svg
      aria-hidden="true"
      class="size-5"
      viewBox="0 0 20 20"
      fill="none"
    >
      <path
        d="M17 12.2A7.5 7.5 0 0 1 7.8 3a7.5 7.5 0 1 0 9.2 9.2Z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
    </svg>
  }
</button>
