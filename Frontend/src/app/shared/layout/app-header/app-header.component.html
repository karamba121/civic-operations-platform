<header
  class="sticky top-0 z-40 w-full border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900"
>
  <div class="flex h-18 items-center justify-between gap-4 px-4 sm:px-6">
    <div class="flex min-w-0 items-center gap-3">
      <button
        type="button"
        class="flex size-10 shrink-0 items-center justify-center rounded-lg border border-gray-200 text-gray-500 transition hover:bg-gray-50 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-gray-800"
        [ngClass]="{
          'bg-gray-100 dark:bg-white/[0.03]': isMobileOpen$ | async
        }"
        (click)="handleToggle()"
        aria-label="Alternar menu lateral"
      >
        <svg
          aria-hidden="true"
          class="size-5"
          viewBox="0 0 20 20"
          fill="none"
        >
          <path
            d="M3 5h14M3 10h9M3 15h14"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <div class="min-w-0">
        <p
          class="truncate text-sm font-semibold text-gray-900 dark:text-white"
        >
          {{ actorContext.tenantName }}
        </p>
        <p class="truncate text-xs text-gray-500 dark:text-gray-400">
          Ambiente administrativo
        </p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <app-theme-toggle-button />
      <div
        class="hidden h-9 w-px bg-gray-200 dark:bg-gray-800 sm:block"
      ></div>
      <div class="hidden text-right sm:block">
        <p class="text-sm font-medium text-gray-800 dark:text-white/90">
          {{ actorContext.userName }}
        </p>
        <p class="text-xs text-gray-500 dark:text-gray-400">
          Identidade provisória
        </p>
      </div>
      <span
        class="flex size-10 items-center justify-center rounded-full bg-brand-100 text-sm font-semibold text-brand-700 dark:bg-brand-500/20 dark:text-brand-300"
      >
        AL
      </span>
    </div>
  </div>
</header>
