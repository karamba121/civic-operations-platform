name: CI and Docker Hub

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: civic_operations
          POSTGRES_USER: civic_ops
          POSTGRES_PASSWORD: civic_ops_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civic_ops -d civic_operations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: civic_ops
          RABBITMQ_DEFAULT_PASS: civic_ops_dev
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: Backend/global.json

      - name: Restore
        working-directory: Backend
        run: dotnet restore CivicOperationsPlatform.sln

      - name: Test
        working-directory: Backend
        run: >-
          dotnet test CivicOperationsPlatform.sln
          --configuration Release
          --no-restore
          --logger "console;verbosity=normal"

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Test
        working-directory: Frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        working-directory: Frontend
        run: npm run build

  operations:
    name: Compose and Prometheus validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Prometheus configuration
        run: >-
          docker run --rm
          --entrypoint promtool
          -v "${{ github.workspace }}/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro"
          -v "${{ github.workspace }}/observability/rules:/etc/prometheus/rules:ro"
          prom/prometheus:v3.4.1
          check config /etc/prometheus/prometheus.yaml

      - name: Test Prometheus alert rules
        run: >-
          docker run --rm
          --entrypoint promtool
          -v "${{ github.workspace }}/observability:/etc/civicops:ro"
          -w /etc/civicops/tests
          prom/prometheus:v3.4.1
          test rules civicops-alerts.test.yaml

  publish:
    name: Publish Docker images
    if: github.event_name != 'pull_request'
    needs:
      - backend
      - frontend
      - operations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/civic-operations-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: Backend
          file: Backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/civic-operations-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: Frontend
          file: Frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
